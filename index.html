<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/EXIF_Room/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="room">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="preload" href="assets/assets/images/logoFullSvg.svg" as="image">

  <title>room</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Remove default tap highlights and outlines on iOS Safari */
    * {
      -webkit-tap-highlight-color: transparent !important;
      -webkit-touch-callout: none !important;
      outline: none !important;
    }

    /* Off-screen and hide the image picker input container and elements */
    #__image_picker_web-file-input,
    flt-image-picker-inputs {
      position: fixed !important;
      top: -100px !important;
      left: -100px !important;
      width: 1px !important;
      height: 1px !important;
      opacity: 0 !important;
      pointer-events: none !important;
      visibility: hidden !important;
    }

    #__image_picker_web-file-input input,
    flt-image-picker-inputs input {
      position: fixed !important;
      top: -100px !important;
      left: -100px !important;
      width: 1px !important;
      height: 1px !important;
      opacity: 0 !important;
      pointer-events: none !important;
      visibility: hidden !important;
      -webkit-tap-highlight-color: transparent !important;
      outline: none !important;
    }

    body {
      background-color: #121212;
      margin: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #loading-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 9999;
      background-color: #121212;
      transition: opacity 0.5s ease-out;
    }

    .logo {
      width: 160px;
      margin-bottom: 40px;
    }

    .loading-text {
      font-size: 13px;
      font-weight: 500;
      color: #eeeeee;
      margin-bottom: 16px;
      text-align: left;
      width: 50px;
    }

    .progress-bar-container {
      width: 180px;
      height: 6px;
      background-color: #333333;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background-color: #ffffff;
      border-radius: 3px;
      transition: width 0.3s ease-out;
    }
  </style>
</head>
<body oncontextmenu="return false;">
  <script>
    window.addEventListener('contextmenu', function(e) {
      e.preventDefault();
    }, false);
  </script>
  <div id="loading-indicator">
    <img src="assets/assets/images/logoFullSvg.svg" alt="EXIF Room Logo" class="logo" />
    <div class="loading-text" id="loading-text">로딩중</div>
    <div class="progress-bar-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
  </div>

  <script>
    const loadingText = document.getElementById('loading-text');
    let dotCount = 0;
    // 1초에 한 바퀴 루프 돌기 (250ms 마다 변경)
    window.loadingInterval = setInterval(() => {
      dotCount = (dotCount + 1) % 4;
      let dots = '';
      for (let i = 0; i < dotCount; i++) dots += '.';
      loadingText.innerText = '로딩중' + dots;
    }, 250);

    const progressBar = document.getElementById('progress-bar');
    window.loadingProgress = 0;
    window.progressInterval = setInterval(() => {
      if (window.loadingProgress < 85) {
        window.loadingProgress += (85 - window.loadingProgress) * 0.05;
        progressBar.style.width = window.loadingProgress + '%';
      }
    }, 100);
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
  <script>
    window.convertHeicToJpeg = async function(heicBlobUrl) {
      try {
        const response = await fetch(heicBlobUrl);
        const blob = await response.blob();
        const jpegBlob = await heic2any({ blob: blob, toType: "image/jpeg", quality: 1.0 });
        const finalBlob = Array.isArray(jpegBlob) ? jpegBlob[0] : jpegBlob;
        return URL.createObjectURL(finalBlob);
      }
    };

    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().then(function(granted) {
        console.log('Persistent storage granted:', granted);
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
