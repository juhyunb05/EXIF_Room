<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="room">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>room</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Remove default tap highlights and outlines on iOS Safari */
    * {
      -webkit-tap-highlight-color: transparent !important;
      -webkit-touch-callout: none !important;
      outline: none !important;
    }

    /* Off-screen and hide the image picker input container and elements */
    #__image_picker_web-file-input,
    flt-image-picker-inputs {
      position: fixed !important;
      top: -100px !important;
      left: -100px !important;
      width: 1px !important;
      height: 1px !important;
      opacity: 0 !important;
      pointer-events: none !important;
      visibility: hidden !important;
    }

    #__image_picker_web-file-input input,
    flt-image-picker-inputs input {
      position: fixed !important;
      top: -100px !important;
      left: -100px !important;
      width: 1px !important;
      height: 1px !important;
      opacity: 0 !important;
      pointer-events: none !important;
      visibility: hidden !important;
      -webkit-tap-highlight-color: transparent !important;
      outline: none !important;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
  <script>
    window.convertHeicToJpeg = async function(heicBlobUrl) {
      try {
        const response = await fetch(heicBlobUrl);
        const blob = await response.blob();
        const jpegBlob = await heic2any({ blob: blob, toType: "image/jpeg", quality: 1.0 });
        const finalBlob = Array.isArray(jpegBlob) ? jpegBlob[0] : jpegBlob;
        return URL.createObjectURL(finalBlob);
      } catch (e) {
        console.error('HEIC conversion error: ', e);
        throw e;
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
